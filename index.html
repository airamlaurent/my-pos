<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop POS">
<meta name="theme-color" content="#F2F2F7">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Digital Shop POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: iPad-style split on wide screens (product grid + live order panel); on phones the order panel is a bottom sheet behind a floating "View order" bar. Bottom tab bar: Register / Products / Orders / Reports. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#0B0B0F; --muted:#6C6C70; --line:rgba(60,60,67,.16);
  --fill:rgba(118,118,128,.12); --accent:#007AFF; --accent-fg:#FFFFFF; --good:#248A3D; --good-bg:rgba(52,199,89,.16);
  --bad:#D70015; --warn:#B25000; --wpov:rgba(255,255,255,0); --blur:rgba(249,249,249,.84); --scrim:rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --muted:#9A9AA0; --line:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.28); --accent:#0A84FF; --accent-fg:#FFFFFF; --good:#30D158; --good-bg:rgba(48,209,88,.18);
  --bad:#FF6961; --warn:#FF9F0A; --blur:rgba(22,22,24,.84); --scrim:rgba(0,0,0,.6); --wpov:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --muted:#9A9AA0; --line:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.28); --accent:#0A84FF; --accent-fg:#FFFFFF; --good:#30D158; --good-bg:rgba(48,209,88,.18);
  --bad:#FF6961; --warn:#FF9F0A; --blur:rgba(22,22,24,.84); --scrim:rgba(0,0,0,.6); --wpov:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 150px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.shell{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 14px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.shop{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column}
.shop b{color:var(--fg);font-weight:600}

.reg{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.catalog{min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 10px;height:38px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;font:inherit;color:var(--fg);height:100%;outline:none}
.search input::placeholder{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding-top:14px}
.tile{position:relative;text-align:left;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile:disabled{opacity:.5;cursor:default;transform:none}
.art{aspect-ratio:16/10;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px;letter-spacing:.04em;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2))}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.tile h3{font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;min-height:2.6em}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
.tile .pr{font-weight:700;font-variant-numeric:tabular-nums}
.stk{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--muted)}
.stk.low{background:rgba(255,149,0,.18);color:var(--warn)}
.stk.out{background:rgba(255,59,48,.14);color:var(--bad)}
.qtybadge{position:absolute;top:4px;right:4px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--card)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 0}

/* order panel */
.cart{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.cart-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cart-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--accent);font-weight:500}
.link.bad{color:var(--bad)}
.grab{display:none;width:36px;height:5px;border-radius:3px;background:var(--fill);margin:-6px auto 2px}
.lines{display:flex;flex-direction:column;max-height:36vh;overflow-y:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line b{font-weight:600;display:block;overflow-wrap:anywhere}
.line small{color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px}
.step button{width:34px;height:32px;font-size:18px;font-weight:500;color:var(--accent)}
.step button:disabled{opacity:.3}
.step span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.amt{min-width:72px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.none{color:var(--muted);text-align:center;padding:22px 0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.tot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot .m{color:var(--muted);font-size:13px}
.tot .big{font-size:22px;font-weight:700;letter-spacing:-.01em;padding-top:4px}
.btn{height:52px;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:17px;width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn.alt{background:var(--fill);color:var(--accent)}
.btn.danger{background:rgba(255,59,48,.14);color:var(--bad)}
.btn.sm{height:40px;font-size:15px;border-radius:11px}

@media (max-width:899px){
  .cart{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.25)}
  .cart.open{transform:none}
  .grab{display:block}
  .scrim.showc{opacity:1;pointer-events:auto}
}
@media (min-width:900px){
  .reg{grid-template-columns:minmax(0,1fr) 380px}
  .cart{position:sticky;top:12px}
  .lines{max-height:calc(100vh - 520px);min-height:80px}
  .cart-close{display:none}
  .cartbar{display:none!important}
}
.cartbar{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(62px + env(safe-area-inset-bottom,0px));height:54px;border-radius:16px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;box-shadow:0 6px 24px rgba(0,122,255,.35);max-width:1148px;margin:0 auto}
.cartbar .n{background:rgba(255,255,255,.25);border-radius:12px;min-width:26px;height:26px;padding:0 8px;display:grid;place-items:center;font-size:14px;margin-right:10px}
.cartbar span.l{display:flex;align-items:center}
.cartbar b{font-variant-numeric:tabular-nums}

.tabbar{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:2px 0}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:35;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

.sheet{position:fixed;z-index:60;left:50%;bottom:0;width:min(440px,100%);max-height:94vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
@media (min-width:600px){.sheet{bottom:auto;top:50%;border-radius:22px;transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .25s}.sheet.open{transform:translate(-50%,-50%);opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h h2{font-size:18px;font-weight:700}
.due{text-align:center;padding:6px 0 14px}
.due small{color:var(--muted);display:block;font-size:13px}
.due b{font-size:40px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;font-weight:700}
.tender{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;gap:6px;margin:12px 0;font-variant-numeric:tabular-nums}
.tender div{display:flex;justify-content:space-between}
.tender .in{font-size:24px;font-weight:700}
.tender .ok{color:var(--good);font-weight:600}.tender .short{color:var(--bad);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:38px;border-radius:10px;background:var(--card);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.pad button{height:50px;border-radius:12px;background:var(--card);font-size:22px;font-weight:500;box-shadow:var(--shadow)}
.pad button:active{background:var(--fill)}
.note{background:var(--card);border-radius:14px;padding:16px;color:var(--muted);text-align:center;margin:12px 0 10px}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:4px auto 10px}
.okmark svg{width:34px;height:34px}
.rc{background:var(--card);border-radius:14px;padding:14px;margin:12px 0 10px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.rc div{display:flex;justify-content:space-between;gap:12px}
.rc .m{color:var(--muted);font-size:13px}
.rc hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.acts{display:grid;gap:8px}
.deliv{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;display:grid;gap:10px}
.deliv h3{font-size:14px;font-weight:600}
.deliv .lk{font-size:13px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:normal}
.deliv .lk b{color:var(--fg);font-weight:600;display:block}
.ta{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:13px/1.4 var(--font);padding:10px;margin-top:8px}

/* forms */
.fg{background:var(--card);border-radius:14px;overflow:hidden;margin:10px 0}
.fr{display:flex;gap:12px;align-items:center;padding:0 14px;min-height:46px;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr.top{align-items:flex-start}
.fr.top label{padding-top:13px}
.fr label{width:92px;flex:none;color:var(--muted);font-size:14px}
.fr input,.fr textarea{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--fg);outline:none;padding:12px 0;resize:none}
.fr:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 4px 10px}
.err{color:var(--bad);font-size:14px;margin:0 4px 10px}
.photo{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.pic{width:88px;height:88px;border-radius:12px;background:var(--fill);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;cursor:pointer;flex:none}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.photo .side{display:grid;gap:8px;justify-items:start}

/* products / orders / reports */
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.phead .btn{width:auto;height:40px;padding:0 18px;font-size:15px;border-radius:12px}
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.prow{width:100%;text-align:left;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .art{aspect-ratio:1/1;font-size:16px;border-radius:10px}
.prow b{font-weight:600;display:block;overflow-wrap:anywhere}
.prow small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.prow .pr{font-weight:700;font-variant-numeric:tabular-nums}
.ord{width:100%;text-align:left;padding:13px 16px;border-top:1px solid var(--line);display:block}
.ord:first-child{border-top:0}
.ord .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ord b{font-weight:600}
.ord small{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--muted);margin-left:6px;vertical-align:1px}
.det{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.det div{display:flex;justify-content:space-between;gap:10px}
.det .btn{margin-top:8px}
.banner{font-size:13px;color:var(--muted);margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;letter-spacing:-.015em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.panel{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h2{font-size:17px;font-weight:700;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px;opacity:.85}
.bars i.pk{opacity:1}
.bars span{font-size:10px;color:var(--muted);height:12px;white-space:nowrap}
.cap{font-size:13px;color:var(--muted);margin-top:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;margin-bottom:10px}
.hb .nm{display:flex;justify-content:space-between;font-size:14px;gap:8px;overflow-wrap:anywhere}
.hb .tr{grid-column:1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hb .q{grid-row:1/3;grid-column:2;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dayh{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:600;margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.saved{color:var(--good);font-size:14px;margin:0 4px 10px}
.banner .link{display:inline}
.fr input[type=date],.fr input[type=time]{min-width:0}
button.shop{align-items:flex-end;max-width:55%;cursor:pointer;font-size:13px;text-align:right}

.lock::before{content:"";position:fixed;inset:0;background:var(--wpov);pointer-events:none}
.lkcard{position:relative;width:min(360px,100%);background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--line);border-radius:24px;padding:24px 20px 20px;display:grid;gap:12px;box-shadow:0 12px 48px rgba(0,0,0,.18);text-align:center}
.lklogo{width:68px;height:68px;margin:0 auto;border-radius:16px}
.lkcard h2{font-size:24px;letter-spacing:-.02em;overflow-wrap:anywhere}
.lksub{color:var(--muted);font-size:14px;margin-top:-6px}
.lkin{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:0 14px;outline:none}
.lkin:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.lkrow{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);text-align:left}
.lkrow input{width:18px;height:18px;accent-color:var(--accent)}
.lkerr{color:var(--bad);font-size:14px;min-height:0}
.lkhint{font-size:12.5px;color:var(--muted);text-align:left;margin-top:-4px}
.lkcard .link{font-size:14px}
.sgap{display:grid;gap:12px;max-width:560px}
.stitle{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:10px 4px -4px}
.srow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:0 14px;min-height:48px;text-align:left}
.srow span:last-child{color:var(--muted);overflow-wrap:anywhere;text-align:right}

.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mchip{height:36px;padding:0 15px;border-radius:18px;background:var(--fill);font-weight:500;font-size:14px}
.card .mchip,.fg+.mgrid .mchip{background:var(--fill)}
.mchip.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .off{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div><p class="eyebrow" id="dateline"></p><h1 id="title">Register</h1></div>
    <button class="shop" id="shopbtn" data-a="editshop" aria-label="Edit shop name"><span class="shopt"><b id="shopname"></b><span id="shopsub"></span></span></button>
  </header>
  <main>
    <section id="v-register">
      <div class="reg">
        <div class="catalog">
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search products" autocomplete="off" aria-label="Search products">
          </label>
          <div class="cats" id="cats" hidden></div>
          <div class="grid" id="grid"></div>
        </div>
        <aside class="cart" id="cart" aria-label="Current order"></aside>
      </div>
    </section>
    <section id="v-products" hidden></section>
    <section id="v-orders" hidden></section>
    <section id="v-reports" hidden></section>
    <section id="v-settings" hidden></section>
  </main>
</div>
<button class="cartbar" id="cartbar" data-a="openCart" hidden></button>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="scrim" id="scrim" data-a="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<input type="file" id="pf" accept="image/*" hidden>
<div class="lock" id="lock" hidden></div>

<script>
var KEY='dshop-orders-v1',PKEY='dshop-products-v1';
var VAT=0;
var MKEY='dshop-methods-v1';
function loadMethods(){
  var d=[{id:'gcash',l:'GCash',on:true},{id:'maya',l:'Maya',on:true},{id:'bank',l:'Bank',on:true},{id:'cash',l:'Cash',on:true}];
  try{var x=localStorage.getItem(MKEY);if(x){var a=JSON.parse(x);if(Array.isArray(a)){var l=a.filter(function(m){return m&&m.id&&m.l}).map(function(m){return {id:String(m.id),l:String(m.l),on:m.on!==false}});if(l.some(function(m){return m.on}))return l}}}catch(e){}
  return d;
}
var ALLM=loadMethods(),METHODS=[];
function rebuildMethods(){METHODS=ALLM.filter(function(m){return m.on}).map(function(m){return [m.id,m.l]})}
function saveMethods(){try{localStorage.setItem(MKEY,JSON.stringify(ALLM))}catch(e){}rebuildMethods()}
function firstMethod(){return METHODS.length?METHODS[0][0]:'cash'}
rebuildMethods();
var PAL=[['#6FA8FF','#3D63D8'],['#5FD07A','#2E9D4D'],['#FFC15A','#F08A00'],['#FF8A78','#DF3B2E'],['#C792EA','#8B4FC4'],['#6FD6FF','#2B8FD6']];
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function r2(x){return Math.round(x*100)/100}
function money(n){return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function whole(n){return '₱'+n.toLocaleString('en-PH')}
function mlabel(m){for(var i=0;i<ALLM.length;i++)if(ALLM[i].id===m)return ALLM[i].l;return m}
function tm(t){return new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}
function sameDay(t){return new Date(t).toDateString()===new Date().toDateString()}

function seedProducts(){return [
 {id:'p1',name:'Semester Planner (PDF)',desc:'Weekly and monthly pages for classes, deadlines and exams.',price:149,link:'',stock:null,img:'',sample:true},
 {id:'p2',name:'Budget Tracker (Sheets)',desc:'Track allowance, bills and savings month by month.',price:99,link:'',stock:null,img:'',sample:true},
 {id:'p3',name:'Study Schedule Templates',desc:'Printable timetables and an exam countdown page.',price:79,link:'',stock:null,img:'',sample:true},
 {id:'p4',name:'Notion Student Dashboard',desc:'Notes, tasks and grades together in one workspace.',price:199,link:'',stock:null,img:'',sample:true},
 {id:'p5',name:'Resume Template Pack',desc:'Five editable resume layouts with matching cover letters.',price:129,link:'',stock:null,img:'',sample:true},
 {id:'p6',name:'Starter Bundle',desc:'Planner, budget tracker and study templates in one pack.',price:249,link:'',stock:14,img:'',sample:true}
]}
var byId={};
function reindex(){byId={};P.forEach(function(p){byId[p.id]=p})}
function loadP(){try{var s=localStorage.getItem(PKEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a}}catch(e){}return seedProducts()}
var P=loadP();reindex();

function calc(cart,disc){
  var lines=[],sub=0;
  Object.keys(cart).forEach(function(id){var q=cart[id],it=byId[id];if(q>0&&it){lines.push({id:id,q:q,n:it.name,p:it.price,link:it.link||'',amt:it.price*q});sub+=it.price*q}});
  var off=r2(sub*disc/100),total=r2(sub-off);
  return {lines:lines,sub:sub,off:off,total:total,vat:VAT?r2(total*VAT/(100+VAT)):0,count:lines.reduce(function(a,l){return a+l.q},0)};
}
function seedOrders(){
  var d=new Date();
  function mk(no,h,m,items,method,cust,disc){
    var t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime(),cart={};
    items.forEach(function(x){cart[x[0]]=x[1]});
    var c=calc(cart,disc||0);
    return {no:no,t:t,items:c.lines.map(function(l){return {id:l.id,q:l.q,n:l.n,p:l.p,link:''}}),sub:c.sub,off:c.off,total:c.total,vat:c.vat,method:method,disc:disc||0,cust:cust||'',ref:'',sample:true};
  }
  return [
    mk(1001,8,5,[['p1',1]],'gcash','Mika'),mk(1002,8,40,[['p2',1],['p3',1]],'maya','Jon'),mk(1003,9,15,[['p4',1]],'bank','Bea'),
    mk(1004,10,2,[['p1',1],['p2',1]],'gcash','',10),mk(1005,11,30,[['p5',1]],'cash'),mk(1006,12,10,[['p6',1]],'gcash','Rina'),
    mk(1007,12,45,[['p3',2]],'maya'),mk(1008,13,20,[['p1',1],['p4',1]],'bank','Kai',20),mk(1009,13,40,[['p5',1]],'gcash')
  ];
}
function loadO(){try{var s=localStorage.getItem(KEY);if(s!==null){var a=JSON.parse(s);if(Array.isArray(a))return a}}catch(e){}return seedOrders()}

var SKEY='dshop-name-v1';
function loadShop(){try{var v=localStorage.getItem(SKEY);return v===null?'Airam Laurent':v}catch(e){return 'Airam Laurent'}}
var S={lock:null,lerr:'',lbusy:false,stmsg:'',stok:false,theme:'auto',shop:loadShop(),shopDraft:'',q:'',cart:{},disc:0,tab:'register',sheet:null,method:firstMethod(),catf:'All',cform:null,cash:'',ref:'',cust:'',orders:loadO(),last:null,cartOpen:false,open:null,form:null,saveErr:false,range:'all',delNo:null,of:null};
function persist(){
  var bad=false;
  try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){bad=true}
  try{localStorage.setItem(KEY,JSON.stringify(S.orders))}catch(e){bad=true}
  S.saveErr=bad;
}
function nextNo(){return S.orders.reduce(function(a,o){return Math.max(a,o.no)},1000)+1}
function inRange(o){if(S.range==='all')return true;if(S.range==='today')return sameDay(o.t);var n=new Date(),days=S.range==='7'?7:30,s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-(days-1)).getTime();return o.t>=s}
function msgFor(o){return 'Hi '+(o.cust||'there')+'! Thanks for your order #'+o.no+(S.shop?' from '+S.shop:'')+'. Here are your files:\n'+o.items.map(function(l){return '• '+l.n+': '+(l.link||'(link coming soon)')}).join('\n')+'\nEnjoy!'}
function colFor(id){var n=0;for(var i=0;i<id.length;i++)n+=id.charCodeAt(i);return PAL[n%PAL.length]}
function ini(n){return n.split(/\s+/).map(function(w){return w.charAt(0)}).join('').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'•'}
function artHtml(p){var c=colFor(p.id);return '<div class="art" style="--c1:'+c[0]+';--c2:'+c[1]+'">'+(p.img?'<img src="'+p.img+'" alt="">':esc(ini(p.name)))+'</div>'}
function stockPill(p,inCart){
  if(p.stock==null)return '';
  if(p.stock<=0)return '<span class="stk out">Sold out</span>';
  return '<span class="stk'+(p.stock<=3?' low':'')+'">'+p.stock+' left</span>';
}

var ICON={
 register:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
 products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
 orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>',
 settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
 reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'
};
var TABS=[['register','Register','Register'],['products','Products','Products'],['orders','Orders','Orders'],['reports','Reports','Reports'],['settings','Settings','Settings']];

function renderTabs(){
  $('#tabbar').innerHTML=TABS.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+ICON[t[0]]+'<span>'+t[1]+'</span></button>'}).join('');
  TABS.forEach(function(t){$('#v-'+t[0]).hidden=S.tab!==t[0];if(S.tab===t[0])$('#title').textContent=t[2]});
}
function pcat(p){return (p.cat||'').trim()}
function cats(){var out=[];P.forEach(function(p){var c=pcat(p);if(c&&out.indexOf(c)<0)out.push(c)});return out}
function catCount(c){return P.filter(function(p){return pcat(p)===c}).length}
function renderCats(){
  var cs=cats(),el=$('#cats');
  if(!cs.length){el.innerHTML='';el.hidden=true;S.catf='All';return}
  if(S.catf!=='All'&&S.catf!=='__none'&&cs.indexOf(S.catf)<0)S.catf='All';
  var list=['All'].concat(cs);if(P.some(function(p){return !pcat(p)}))list.push('__none');
  el.hidden=false;
  el.innerHTML=list.map(function(c){return '<button class="chip'+(S.catf===c?' on':'')+'" data-a="catf" data-c="'+esc(c)+'">'+(c==='__none'?'Uncategorized':esc(c))+'</button>'}).join('');
}
function renderGrid(){
  var q=S.q.trim().toLowerCase();
  var items=P.filter(function(p){var ok=S.catf==='All'||(S.catf==='__none'?!pcat(p):pcat(p)===S.catf);return ok&&(!q||p.name.toLowerCase().indexOf(q)>-1||(p.desc||'').toLowerCase().indexOf(q)>-1)});
  var h;
  if(!P.length)h='<div class="empty">No products yet. Open the Products tab to add your first one.</div>';
  else if(!items.length)h='<div class="empty">'+(q?'No products match “'+esc(S.q)+'”.':'No products in this category yet.')+'</div>';
  else h=items.map(function(p){
    var qty=S.cart[p.id]||0,full=p.stock!=null&&p.stock-qty<=0;
    return '<button class="tile" data-a="add" data-id="'+p.id+'"'+(full?' disabled':'')+' aria-label="Add '+esc(p.name)+'">'+(qty?'<span class="qtybadge">'+qty+'</span>':'')+
      artHtml(p)+'<div><h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.desc)+'</p><div class="row"><span class="pr">'+whole(p.price)+'</span>'+stockPill(p)+'</div></div></button>';
  }).join('');
  $('#grid').innerHTML=h;
}
function renderCart(){
  var c=calc(S.cart,S.disc),h='';
  h+='<div class="grab"></div><div class="cart-h"><h2>Order #'+nextNo()+'</h2><span>'+
    (c.count?'<button class="link bad" data-a="clear">Clear</button>':'')+'<button class="link cart-close" data-a="closeCart" style="margin-left:14px">Done</button></span></div>';
  h+=c.lines.length?'<div class="lines">'+c.lines.map(function(l){
    var it=byId[l.id],maxed=it.stock!=null&&l.q>=it.stock;
    return '<div class="line"><div><b>'+esc(l.n)+'</b><small>'+money(l.p)+'</small></div>'+
      '<div class="step"><button data-a="dec" data-id="'+l.id+'" aria-label="Remove one '+esc(l.n)+'">−</button><span>'+l.q+'</span><button data-a="inc" data-id="'+l.id+'"'+(maxed?' disabled':'')+' aria-label="Add one '+esc(l.n)+'">+</button></div>'+
      '<div class="amt">'+money(l.amt)+'</div></div>';}).join('')+'</div>':'<div class="none">No products yet. Tap a product to add it.</div>';
  h+='<div><div class="lbl">Buyer (optional)</div><div class="fg" style="margin:0"><div class="fr"><input id="cust" maxlength="60" placeholder="Name, @handle or email" value="'+esc(S.cust)+'" autocomplete="off"></div></div></div>';
  h+='<div><div class="lbl">Discount</div><div class="seg">'+[[0,'None'],[10,'10% off'],[20,'20% off']].map(function(d){
    return '<button data-a="disc" data-d="'+d[0]+'" class="'+(S.disc===d[0]?'on':'')+'">'+d[1]+'</button>'}).join('')+'</div></div>';
  h+='<div class="tot"><div class="m"><span>Subtotal</span><span>'+money(c.sub)+'</span></div>'+
    (c.off?'<div class="m"><span>Discount ('+S.disc+'%)</span><span>−'+money(c.off)+'</span></div>':'')+
    (VAT?'<div class="m"><span>VAT ('+VAT+'%) included</span><span>'+money(c.vat)+'</span></div>':'')+
    '<div class="big"><span>Total</span><span>'+money(c.total)+'</span></div></div>';
  h+='<button class="btn" data-a="charge"'+(c.count?'':' disabled')+'>'+(c.count?'Charge '+money(c.total):'Charge')+'</button>';
  var el=$('#cart');el.innerHTML=h;el.classList.toggle('open',S.cartOpen);
  var bar=$('#cartbar');
  if(c.count&&S.tab==='register'&&!S.cartOpen&&!S.sheet){bar.hidden=false;bar.innerHTML='<span class="l"><span class="n">'+c.count+'</span>View order</span><b>'+money(c.total)+'</b>'}else bar.hidden=true;
  $('#scrim').classList.toggle('showc',S.cartOpen&&!S.sheet);
}
function deliveryBlock(o){
  var withLink=o.items.filter(function(l){return l.link});
  return '<div class="deliv"><h3>Send to '+esc(o.cust||'the buyer')+'</h3>'+
    (withLink.length?withLink.map(function(l){return '<div class="lk"><b>'+esc(l.n)+'</b>'+esc(l.link)+'</div>'}).join(''):'<div class="lk">No delivery links are set for these products. Add one in the Products tab.</div>')+
    '<button class="btn sm" data-a="copy" data-no="'+o.no+'">Copy delivery message</button></div>';
}
function renderSheet(){
  var sh=$('#sheet'),c=calc(S.cart,S.disc),h='';
  if(S.sheet==='pay'){
    var t=parseFloat(S.cash||'0')||0,ch=r2(t-c.total);
    h+='<div class="sh-h"><h2>Payment</h2><button class="link" data-a="closeSheet">Cancel</button></div>';
    h+='<div class="due"><small>Amount due</small><b>'+money(c.total)+'</b></div>';
    h+='<div class="mgrid" style="margin-top:6px">'+METHODS.map(function(m){return '<button class="mchip'+(S.method===m[0]?' on':'')+'" data-a="method" data-m="'+m[0]+'">'+esc(m[1])+'</button>'}).join('')+'</div>';
    if(S.method==='cash'){
      var opts=[];[c.total,Math.ceil(c.total/100)*100,Math.ceil(c.total/500)*500,Math.ceil(c.total/1000)*1000].forEach(function(v){if(v>=c.total&&opts.indexOf(v)<0)opts.push(v)});
      h+='<div class="tender"><div><span>Cash received</span><span class="in">'+(S.cash?'₱'+S.cash:'₱0')+'</span></div><div><span>'+(ch<0?'Still due':'Change')+'</span><span class="'+(t?(ch<0?'short':'ok'):'')+'">'+(t?money(Math.abs(ch)):'—')+'</span></div></div>';
      h+='<div class="quick">'+opts.slice(0,4).map(function(v,i){return '<button data-a="quick" data-v="'+v+'">'+(i===0?'Exact':whole(v))+'</button>'}).join('')+'</div>';
      h+='<div class="pad">'+['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(function(k){return '<button data-a="key" data-k="'+(k==='⌫'?'b':k)+'" aria-label="'+(k==='⌫'?'Backspace':k)+'">'+k+'</button>'}).join('')+'</div>';
      h+='<button class="btn" data-a="confirm"'+(t>=c.total&&t>0?'':' disabled')+'>Complete sale</button>';
    }else{
      h+='<div class="note">Check that '+money(c.total)+' arrived in your '+esc(mlabel(S.method))+' account, then mark the order as paid.</div>';
      h+='<div class="fg" style="margin-top:0"><div class="fr"><label for="ref">Reference</label><input id="ref" maxlength="40" placeholder="Reference no. (optional)" value="'+esc(S.ref)+'" autocomplete="off"></div></div>';
      h+='<button class="btn" data-a="confirm">Mark as paid</button>';
    }
  }else if(S.sheet==='receipt'&&S.last){
    var o=S.last;
    h+='<div class="okmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>';
    h+='<div class="due" style="padding-top:0"><small>Paid · '+esc(mlabel(o.method))+'</small><b>'+money(o.total)+'</b>'+(o.method==='cash'&&o.change?'<small style="margin-top:4px">Change '+money(o.change)+'</small>':'')+'</div>';
    h+='<div class="rc">'+(S.shop?'<div><b>'+esc(S.shop)+EMO+'</b><span></span></div>':'')+'<div class="m"><span>Order #'+o.no+(o.cust?' · '+esc(o.cust):'')+'</span><span>'+tm(o.t)+'</span></div><hr>'+o.items.map(function(l){return '<div><span>'+l.q+' × '+esc(l.n)+'</span><span>'+money(l.p*l.q)+'</span></div>'}).join('')+'<hr>'+
      '<div class="m"><span>Subtotal</span><span>'+money(o.sub)+'</span></div>'+(o.off?'<div class="m"><span>Discount ('+o.disc+'%)</span><span>−'+money(o.off)+'</span></div>':'')+
      (o.vat?'<div class="m"><span>VAT included</span><span>'+money(o.vat)+'</span></div>':'')+'<div><b>Total</b><b>'+money(o.total)+'</b></div>'+(o.ref?'<div class="m"><span>Reference</span><span>'+esc(o.ref)+'</span></div>':'')+'</div>';
    h+=deliveryBlock(o);
    h+='<div class="acts"><button class="btn" data-a="done">New order</button></div>';
  }else if(S.sheet==='prod'&&S.form){
    var f=S.form;
    h+='<div class="sh-h"><h2>'+(f.id?'Edit product':'New product')+'</h2><button class="link" data-a="closeSheet">Cancel</button></div>';
    h+='<div class="photo"><label class="pic" for="pf">'+(f.img?'<img src="'+f.img+'" alt="Product photo">':'<span>Add<br>photo</span>')+'</label><div class="side"><label class="link" for="pf" style="cursor:pointer">'+(f.img?'Change photo':'Choose photo')+'</label>'+(f.img?'<button class="link bad" data-a="rmimg">Remove photo</button>':'')+'</div></div>';
    h+='<div class="fg">'+
      '<div class="fr"><label for="f-name">Name</label><input id="f-name" data-f="name" maxlength="80" placeholder="Semester Planner" value="'+esc(f.name)+'" autocomplete="off"></div>'+
      '<div class="fr top"><label for="f-desc">Description</label><textarea id="f-desc" data-f="desc" rows="3" maxlength="200" placeholder="What the buyer gets">'+esc(f.desc)+'</textarea></div>'+
      '<div class="fr"><label for="f-price">Price (₱)</label><input id="f-price" data-f="price" inputmode="decimal" placeholder="149" value="'+esc(f.price)+'" autocomplete="off"></div></div>';
    h+='<div class="lbl">Category</div><div class="mgrid" style="margin-bottom:10px"><button class="mchip'+(!f.adding&&!f.cat?' on':'')+'" data-a="fcat" data-c="">None</button>'+cats().map(function(c){return '<button class="mchip'+(!f.adding&&f.cat===c?' on':'')+'" data-a="fcat" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'<button class="mchip'+(f.adding?' on':'')+'" data-a="fnewcat">+ New</button></div>';
    if(f.adding)h+='<div class="fg" style="margin-top:0"><div class="fr"><label for="f-cat">New</label><input id="f-cat" data-f="cat" maxlength="30" placeholder="Category name" value="'+esc(f.cat)+'" autocomplete="off"></div></div>';
    h+='<div class="fg">'+

function bucketData(os){
  var b=[],now=new Date(),i;
  if(S.range==='today'){
    for(i=8;i<=19;i++)b.push({h:i,l:(i%2===0)?hr(i):'',tip:hr(i),v:0});
    os.forEach(function(o){var hh=new Date(o.t).getHours();b.forEach(function(x){if(x.h===hh)x.v+=o.total})});
    return {b:b,unit:'hour',gap:5};
  }
  if(S.range==='all'){
    var first=now;os.forEach(function(o){if(o.t<first.getTime())first=new Date(o.t)});
    var sm=new Date(first.getFullYear(),first.getMonth(),1),lim=new Date(now.getFullYear(),now.getMonth()-11,1);
    if(sm<lim)sm=lim;
    for(var d=new Date(sm);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
      b.push({k:d.getFullYear()*12+d.getMonth(),l:d.toLocaleDateString('en-PH',{month:'short'}),tip:d.toLocaleDateString('en-PH',{month:'long',year:'numeric'}),v:0});
    }
    os.forEach(function(o){var dd=new Date(o.t),kk=dd.getFullYear()*12+dd.getMonth();b.forEach(function(x){if(x.k===kk)x.v+=o.total})});
    return {b:b,unit:'month',gap:5};
  }
  var n=S.range==='7'?7:30;
  for(i=n-1;i>=0;i--){
    var d2=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    b.push({k:d2.toDateString(),l:n===7?d2.toLocaleDateString('en-PH',{weekday:'narrow'}):(i%5===0?String(d2.getDate()):''),tip:d2.toLocaleDateString('en-PH',{month:'short',day:'numeric'}),v:0});
  }
  os.forEach(function(o){var kk=new Date(o.t).toDateString();b.forEach(function(x){if(x.k===kk)x.v+=o.total})});
  return {b:b,unit:'day',gap:n===30?3:5};
}

  var top=Object.keys(items).map(function(n){return [n,items[n]]}).sort(function(a,c){return c[1]-a[1]}).slice(0,5),tq=top.length?top[0][1]:1;
  var lm=ALLM.filter(function(m){return m.on||os.some(function(o){return o.method===m.id})}),pm={};lm.forEach(function(m){pm[m.id]=[0,0]});os.forEach(function(o){if(pm[o.method]){pm[o.method][0]++;pm[o.method][1]+=o.total}});

    '<p class="cap">'+(tot&&pk>=0&&b[pk].v?'Best '+bd.unit+': '+esc(b[pk].tip)+' with '+money(b[pk].v)+'.':'No sales in this range.')+'</p></div>';
  h+='<div class="panel"><h2>Top sellers</h2>'+(top.length?top.map(function(t){return '<div class="hb"><div class="nm"><span>'+esc(t[0])+'</span></div><div class="tr"><i style="width:'+Math.round(t[1]/tq*100)+'%"></i></div><div class="q">'+t[1]+'</div></div>'}).join(''):'<div class="none">Nothing sold in this range.</div>')+'</div>';
  h+='<div class="panel"><h2>Payment types</h2>'+lm.map(function(m){var p=pm[m.id];return '<div class="hb" style="grid-template-columns:minmax(0,1fr) auto"><div class="nm"><span>'+esc(m.l)+'</span><span style="color:var(--muted)">'+p[0]+' order'+(p[0]===1?'':'s')+'</span></div><div class="q" style="grid-row:1;min-width:96px">'+money(p[1])+'</div></div>'}).join('')+'</div>';
  $('#v-reports').innerHTML=h;
}

function saveOrder(again){
  var f=S.of;if(!f)return;f.ok='';
  if(!f.date){f.err='Pick the date of the sale.';renderSheet();return}
  var items=[],sub=0,i,L,name,price,q;
  for(i=0;i<f.lines.length;i++){
    L=f.lines[i];name=L.name.trim();
    if(!name&&!String(L.price).trim())continue;
    price=parseFloat(String(L.price).replace(/,/g,''));q=parseInt(L.qty,10);
    if(!name){f.err='Item '+(i+1)+' needs a name.';renderSheet();return}
    if(isNaN(price)||price<0){f.err='Item '+(i+1)+' needs a price, like 149.';renderSheet();return}
    if(!(q>0)){f.err='Item '+(i+1)+' needs a quantity of 1 or more.';renderSheet();return}
    var pr=L.id&&byId[L.id]?byId[L.id]:null;
    items.push({id:pr?pr.id:'',q:q,n:name,p:r2(price),link:pr?(pr.link||''):''});
    sub+=r2(price)*q;
  }
  if(!items.length){f.err='Add at least one item.';renderSheet();return}
  sub=r2(sub);
  var d=f.date.split('-'),tp=(f.time||'').split(':');
  var t=new Date(+d[0],+d[1]-1,+d[2],f.time?+tp[0]:12,f.time?+tp[1]:0).getTime();
  var o={no:nextNo(),t:t,nt:!f.time,items:items,sub:sub,off:0,total:sub,vat:0,method:f.method,disc:0,cust:f.cust.trim(),ref:'',past:true};
  S.orders.push(o);persist();
  if(again){S.of={date:f.date,time:f.time,cust:'',method:f.method,lines:[blankLine()],err:'',ok:'Saved order #'+o.no+'. Add the next one.'};renderSheet()}
  else{S.sheet=null;S.of=null;renderSheet()}
  renderOrders();renderReports();renderCart();
}

    im.onload=function(){var m=480,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};
    im.onerror=function(){cb(null)};im.src=r.result};
  r.onerror=function(){cb(null)};r.readAsDataURL(file);
}

  else if(a==='logout'){logout()}
  else if(a==='theme'){setTheme(el.dataset.t)}
  else if(a==='editshop'){S.shopDraft=S.shop;S.sheet='shop';renderSheet();renderCart();setTimeout(function(){var i=$('#f-shop');if(i)i.focus()},60)}
  else if(a==='saveshop'){saveShop()}
  else if(a==='range'){S.range=el.dataset.r;renderOrders();renderReports()}
  else if(a==='newo'){openOrderForm()}
  else if(a==='omethod'){if(S.of){S.of.method=el.dataset.m;renderSheet()}}
  else if(a==='addline'){if(S.of){S.of.lines.push(blankLine());renderSheet()}}
  else if(a==='rmline'){if(S.of&&S.of.lines.length>1){S.of.lines.splice(+el.dataset.i,1);renderSheet()}}
  else if(a==='saveo'){saveOrder(false)}
  else if(a==='saveo2'){saveOrder(true)}
  else if(a==='delord'){
    var dno=+el.dataset.no;
    if(S.delNo!==dno){S.delNo=dno;renderOrders();return}
    S.orders=S.orders.filter(function(x){return x.no!==dno});S.delNo=null;S.open=null;persist();renderOrders();renderReports();renderCart();
  }
  else if(a==='rmso'){S.orders=S.orders.filter(function(x){return !x.sample});S.open=null;S.delNo=null;persist();renderOrders();renderReports();renderCart()}
  else if(a==='rmsp'){P.filter(function(x){return x.sample}).forEach(function(x){delete S.cart[x.id]});P=P.filter(function(x){return !x.sample});reindex();persist();renderCats();renderGrid();renderCart();renderProducts();renderSettings()}
  else if(a==='add'||a==='inc'){p=byId[id];if(!p)return;var q=S.cart[id]||0;if(p.stock!=null&&q>=p.stock)return;S.cart[id]=q+1;renderGrid();renderCart()}
  else if(a==='dec'){S.cart[id]=Math.max(0,(S.cart[id]||0)-1);if(!S.cart[id])delete S.cart[id];if(!Object.keys(S.cart).length)S.cartOpen=false;renderGrid();renderCart()}
  else if(a==='disc'){S.disc=+el.dataset.d;renderCart()}
  else if(a==='clear'){S.cart={};S.disc=0;S.cust='';S.cartOpen=false;renderGrid();renderCart()}
  else if(a==='openCart'){S.cartOpen=true;renderCart()}
  else if(a==='closeCart'){S.cartOpen=false;renderCart()}
  else if(a==='scrim'){if(S.sheet==='receipt')finish();else if(S.sheet)closeSheet();else{S.cartOpen=false;renderCart()}}
  else if(a==='charge'){if(calc(S.cart,S.disc).count){S.sheet='pay';S.method=firstMethod();S.cash='';S.ref='';renderSheet();renderCart()}}
  else if(a==='closeSheet'){closeSheet()}
  else if(a==='method'){S.method=el.dataset.m;S.cash='';renderSheet()}
  else if(a==='quick'){S.cash=String(+el.dataset.v);renderSheet()}
  else if(a==='key'){
    var k=el.dataset.k,v=S.cash;
    if(k==='b')v=v.slice(0,-1);
    else if(k==='.'){if(v.indexOf('.')<0)v=(v||'0')+'.'}
    else{if(v.indexOf('.')>-1&&v.split('.')[1].length>=2)return;if(v.length>=8)return;v=(v==='0')?k:v+k}
    S.cash=v;renderSheet();
  }
  else if(a==='confirm'){
    c=calc(S.cart,S.disc);if(!c.count)return;
    var t=parseFloat(S.cash||'0')||0;if(S.method==='cash'&&t<c.total)return;
    var o={no:nextNo(),t:Date.now(),items:c.lines.map(function(l){return {id:l.id,q:l.q,n:l.n,p:l.p,link:l.link}}),sub:c.sub,off:c.off,total:c.total,vat:c.vat,method:S.method,disc:S.disc,cust:S.cust.trim(),ref:S.method==='cash'?'':S.ref.trim(),change:S.method==='cash'?r2(t-c.total):0};
    c.lines.forEach(function(l){var it=byId[l.id];if(it&&it.stock!=null)it.stock=Math.max(0,it.stock-l.q)});
    S.orders.push(o);persist();S.last=o;S.cart={};S.disc=0;S.cust='';S.ref='';S.cartOpen=false;S.sheet='receipt';
    renderGrid();renderSheet();renderCart();renderProducts();renderOrders();renderReports();
  }
  else if(a==='done'){finish()}
  else if(a==='tab'){S.tab=el.dataset.t;S.cartOpen=false;renderTabs();renderCart();window.scrollTo(0,0)}
  else if(a==='expand'){if(e.target.closest('button'))return;var n=+el.dataset.no;S.open=S.open===n?null:n;S.delNo=null;renderOrders()}
  else if(a==='copy'){var ord=S.orders.filter(function(x){return x.no===+el.dataset.no})[0];if(ord)copyText(msgFor(ord),el)}
  else if(a==='newp'){openForm('')}
  else if(a==='editp'){openForm(id)}
  else if(a==='rmimg'){if(S.form){S.form.img='';renderSheet()}}
  else if(a==='savep'){
    var f=S.form;if(!f)return;
    var price=parseFloat(String(f.price).replace(/,/g,''));
    var stock=String(f.stock).trim()===''?null:parseInt(f.stock,10);
    if(!f.name.trim()){f.err='Enter a product name.';renderSheet();return}
    if(!(price>=0)||isNaN(price)){f.err='Enter a price, like 149.';renderSheet();return}
    if(stock!==null&&(isNaN(stock)||stock<0)){f.err='Limit must be a whole number, or leave it empty.';renderSheet();return}
    var cname=(f.cat||'').trim().replace(/\s+/g,' ');
    if(cname.toLowerCase()==='all'||cname.toLowerCase()==='uncategorized'){f.err='Choose a different category name.';renderSheet();return}
    var exc=cats().filter(function(c){return c.toLowerCase()===cname.toLowerCase()})[0];if(exc)cname=exc;
    var rec={name:f.name.trim(),desc:f.desc.trim(),price:r2(price),link:f.link.trim(),stock:stock,img:f.img,cat:cname,sample:false};
    if(f.id){var cur=byId[f.id];Object.keys(rec).forEach(function(k){cur[k]=rec[k]})}
    else{rec.id='p'+Date.now().toString(36);P.push(rec)}
    reindex();persist();S.sheet=null;S.form=null;renderSheet();renderCats();renderGrid();renderCart();renderProducts();renderSettings();
  }
  else if(a==='delp'){
    var g=S.form;if(!g)return;
    if(!g.del){g.del=true;renderSheet();return}
    P=P.filter(function(x){return x.id!==g.id});delete S.cart[g.id];reindex();persist();
    S.sheet=null;S.form=null;renderSheet();renderCats();renderGrid();renderCart();renderProducts();renderSettings();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;renderGrid()}
  else if(t.id==='cust'){S.cust=t.value}
  else if(t.id==='f-shop'){S.shopDraft=t.value}
  else if(t.id==='ref'){S.ref=t.value}
  else if(t.dataset&&t.dataset.cf&&S.cform){S.cform[t.dataset.cf]=t.value;if(S.cform.err){S.cform.err='';var e4=$('#sheet .err');if(e4)e4.remove()}}
  else if(t.dataset&&t.dataset.o&&S.of){S.of[t.dataset.o]=t.value;if(S.of.err){S.of.err='';var e2=$('#sheet .err');if(e2)e2.remove()}}
  else if(t.dataset&&t.dataset.l!==undefined&&S.of){lineInput(t);if(S.of.err){S.of.err='';var e3=$('#sheet .err');if(e3)e3.remove()}}
  else if(t.dataset&&t.dataset.f&&S.form){S.form[t.dataset.f]=t.value;if(S.form.err){S.form.err='';var er=$('#sheet .err');if(er)er.remove()}}
});
document.addEventListener('change',function(e){
  if(e.target.id!=='pf')return;
  var file=e.target.files&&e.target.files[0];if(!file||!S.form)return;
  shrink(file,function(url){if(url&&S.form){S.form.img=url;renderSheet()}else if(S.form){S.form.err='That photo could not be read. Try a different image.';renderSheet()}});
  e.target.value='';
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(S.sheet==='receipt')finish();else if(S.sheet)closeSheet();else if(S.cartOpen){S.cartOpen=false;renderCart()}}
  else if(e.key==='Enter'&&e.target.id==='f-shop'){e.preventDefault();saveShop()}
  else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ord')){e.preventDefault();e.target.click()}
});

var EMO='<span class="emo" aria-hidden="true"></span>';
var AKEY='dshop-auth-v1',TKEY='dshop-theme-v1',SESS='dshop-sess',KEEP='dshop-keep-v1';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function getAuth(){try{var a=JSON.parse(lsGet(AKEY));return a&&a.u&&a.h?a:null}catch(e){return null}}
function hexs(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function rnd(){try{var a=new Uint8Array(16);crypto.getRandomValues(a);return hexs(a)}catch(e){return String(Math.random()).slice(2)+String(Date.now())}}
function soft(pw,salt){var t=salt+'|'+pw,a=5381,b=52711,i,c;for(i=0;i<t.length;i++){c=t.charCodeAt(i);a=((a<<5)+a)^c;b=((b<<5)+b)^(c*31)}return (a>>>0).toString(16)+(b>>>0).toString(16)}
function hashPw(pw,salt){
  try{
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256)}).then(hexs).catch(function(){return soft(pw,salt)});
  }catch(e){return Promise.resolve(soft(pw,salt))}
}
function applyTheme(){var r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme')}
function setTheme(t){S.theme=t;lsSet(TKEY,t);applyTheme();renderSettings()}
function unlock(keep){
  ssSet(SESS,'1');if(keep)lsSet(KEEP,'1');else lsDel(KEEP);
  S.lock=null;S.lerr='';S.lbusy=false;renderLock();renderSettings();window.scrollTo(0,0);
}
function logout(){
  ssDel(SESS);lsDel(KEEP);S.lock='login';S.lerr='';S.tab='register';S.cartOpen=false;S.sheet=null;S.form=null;S.of=null;
  renderLock();renderTabs();renderCart();renderSheet();
}
function lkField(id,type,ph,ac,label){return '<input class="lkin" id="'+id+'" type="'+type+'" placeholder="'+ph+'" autocomplete="'+ac+'" aria-label="'+label+'" autocapitalize="none" autocorrect="off" spellcheck="false">'}
function renderLock(){
  var lk=$('#lock'),st=S.lock;
  document.documentElement.classList.toggle('locked',!!st);
  lk.hidden=!st;
  if(!st){lk.innerHTML='';return}
  var h='<form class="lkcard" id="lkform"><img class="lklogo" src="'+LOGO+'" alt=""><h2>'+esc(S.shop||'Digital Shop')+EMO+'</h2>';
  if(st==='setup'){
    h+='<p class="lksub">Create your login to protect this page.</p>'+
      lkField('lk-u','text','Username','username','Username')+lkField('lk-p','password','Password (6+ characters)','new-password','Password')+lkField('lk-p2','password','Confirm password','new-password','Confirm password')+
      lkField('lk-r','text','Recovery word','off','Recovery word')+'<p class="lkhint">Remember the recovery word. It is the only way to reset your password if you forget it.</p>';
  }else if(st==='login'){
    h+='<p class="lksub">Log in to open your shop.</p>'+lkField('lk-u','text','Username','username','Username')+lkField('lk-p','password','Password','current-password','Password');
  }else{
    h+='<p class="lksub">Reset your password with your recovery word.</p>'+lkField('lk-u','text','Username','username','Username')+lkField('lk-r','text','Recovery word','off','Recovery word')+lkField('lk-p','password','New password (6+ characters)','new-password','New password');
  }
  if(st!=='forgot')h+='<label class="lkrow"><input type="checkbox" id="lk-k" checked> Keep me logged in on this device</label>';
  h+='<p class="lkerr" role="alert">'+esc(S.lerr)+'</p>';
  h+='<button class="btn" type="submit"'+(S.lbusy?' disabled':'')+'>'+(st==='setup'?'Create login':st==='login'?'Log in':'Reset password')+'</button>';
  if(st==='login')h+='<button class="link" type="button" data-a="lkforgot">Forgot password?</button>';
  if(st==='forgot')h+='<button class="link" type="button" data-a="lkback">Back to log in</button>';
  h+='</form>';
  lk.innerHTML=h;
  var f=lk.querySelector('input.lkin');if(f)setTimeout(function(){f.focus()},50);
}
function lkErr(m){S.lerr=m;S.lbusy=false;renderLock()}
function gv(id){var e=document.getElementById(id);return e?e.value:''}
function submitLock(){
  var st=S.lock,u=gv('lk-u').trim(),p=gv('lk-p'),keep=!!(document.getElementById('lk-k')&&document.getElementById('lk-k').checked),a=getAuth();
  if(st==='setup'){
    var p2=gv('lk-p2'),r=gv('lk-r').trim().toLowerCase();
    if(u.length<3)return lkErr('Username needs at least 3 characters.');
    if(p.length<6)return lkErr('Password needs at least 6 characters.');
    if(p!==p2)return lkErr('The two passwords do not match.');
    if(r.length<3)return lkErr('Enter a recovery word of at least 3 characters.');
    var s1=rnd(),s2=rnd();
    Promise.all([hashPw(p,s1),hashPw(r,s2)]).then(function(x){
      if(!lsSet(AKEY,JSON.stringify({u:u,s:s1,h:x[0],rs:s2,rh:x[1]})))return lkErr('This browser would not save your login. Turn off private browsing and try again.');
      unlock(keep);
    });
  }else if(st==='login'){
    if(!a)return lkErr('No login is saved in this browser yet.');
    hashPw(p,a.s).then(function(h){
      if(u.toLowerCase()===a.u.toLowerCase()&&h===a.h)unlock(keep);else lkErr('Wrong username or password.');
    });
  }else{
    var rw=gv('lk-r').trim().toLowerCase();
    if(!a)return lkErr('No login is saved in this browser yet.');
    if(p.length<6)return lkErr('New password needs at least 6 characters.');
    Promise.all([hashPw(rw,a.rs),hashPw(p,a.s)]).then(function(x){
      if(u.toLowerCase()!==a.u.toLowerCase()||x[0]!==a.rh)return lkErr('Username or recovery word is not right.');
      a.h=x[1];lsSet(AKEY,JSON.stringify(a));S.lerr='';unlock(false);
    });
  }
}

  var have=ALLM.map(function(m){return m.l.toLowerCase()}),sug=['GoTyme','PayPal','BDO','BPI','UnionBank','Shopee','Other'].filter(function(n){return have.indexOf(n.toLowerCase())<0});
  if(sug.length)h+='<div class="mgrid">'+sug.map(function(n){return '<button class="mchip" data-a="msug" data-n="'+esc(n)+'">+ '+esc(n)+'</button>'}).join('')+'</div>';
  h+='<div class="stitle">Account</div><div class="srow"><span>Username</span><span>'+esc(a?a.u:'')+'</span></div>';
  h+='<form id="stform" class="sgap"><div class="fg" style="margin:0"><div class="fr"><label for="st-cur">Current</label><input id="st-cur" type="password" autocomplete="current-password" placeholder="Current password"></div><div class="fr"><label for="st-new">New</label><input id="st-new" type="password" autocomplete="new-password" placeholder="New password (6+)"></div></div>';
  if(S.stmsg)h+='<p class="'+(S.stok?'saved':'err')+'" style="margin:0 4px">'+esc(S.stmsg)+'</p>';

  h+='<button class="btn danger" data-a="logout">Log out</button>';

function addMethod(name){
  name=String(name||'').trim().replace(/\s+/g,' ').slice(0,20);if(!name)return;
  var ex=ALLM.filter(function(m){return m.l.toLowerCase()===name.toLowerCase()})[0];
  if(ex){ex.on=true}
  else{
    var base=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'m',id=base,n=2;
    while(ALLM.some(function(m){return m.id===id})){id=base+'-'+n;n++}
    ALLM.push({id:id,l:name,on:true});
  }
  saveMethods();renderSettings();renderReports();
}
function submitSettings(){
  var a=getAuth(),cur=gv('st-cur'),nw=gv('st-new');
  function msg(m,ok){S.stmsg=m;S.stok=!!ok;renderSettings()}
  if(!a)return msg('No login is saved yet.');
  if(nw.length<6)return msg('New password needs at least 6 characters.');
  hashPw(cur,a.s).then(function(h){
    if(h!==a.h)return msg('Current password is not right.');
    var ns=rnd();return hashPw(nw,ns).then(function(nh){a.s=ns;a.h=nh;lsSet(AKEY,JSON.stringify(a));msg('Password changed.',true)});
  });
}
